services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_USER: medicase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: medicase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cognito:
    image: jagregory/cognito-local:3.23.3
    # The user pool and the app client come from docker/cognito-local, created users are kept in a volume.
    entrypoint:
      - sh
      - -c
      - "[ -f /app/.cognito/.seeded ] || (cp -r /seed/. /app/.cognito/ && touch /app/.cognito/.seeded); exec node /app/start.js"
    ports:
      - "9229:9229"
    volumes:
      - ./docker/cognito-local:/seed:ro
      - cognito:/app/.cognito

  api:
    build: .
    depends_on:
      - db
      - cognito
    # The API exits when the database is not ready yet, so let Docker start it again.
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MedicalDatabase: "Host=db;Database=medicase;Username=medicase;Password=${DB_PASSWORD}"
      ConnectionStrings__PublishedDatabase: "Host=db;Database=medicase_published;Username=medicase;Password=${DB_PASSWORD}"
      Seed__AdminEmail: admin@medicase.local
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__SampleContent: ${SEED_SAMPLE_CONTENT:-true}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      FileStorage__RootPath: /home/app/files
      Cognito__UserPoolId: local_medicase
      Cognito__ClientId: medicaselocalclient000001
      Cognito__Issuer: http://cognito:9229/local_medicase
      Cognito__ServiceUrl: http://cognito:9229
      # cognito-local accepts any credentials, real ones are needed only for AI translations and speech.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_REGION: eu-central-1
    ports:
      - "8080:8080"
    volumes:
      - files:/home/app/files

volumes:
  pgdata:
  files:
  cognito:
